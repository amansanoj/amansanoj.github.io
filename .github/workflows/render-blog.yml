name: Build and Deploy Site
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use GitHub Actions as Pages Source
        uses: actions/github-script@v8
        with:
          script: |
            const site = await github.rest.repos.getPages({ ...context.repo });
            if (site.data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...context.repo,
                build_type: 'workflow'
              });
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
